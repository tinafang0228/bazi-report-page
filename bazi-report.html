<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>八字古典考释 · 六维专线</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3ece0;color:#333;}
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 40px;}
  h1{font-size:20px;text-align:center;color:#5a4a22;margin:10px 0 2px;}
  .tip{text-align:center;font-size:12px;color:#9a8a60;margin-bottom:16px;}
  .card{background:#fff;border:1px solid #e0d2a8;border-radius:10px;padding:14px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  label{display:block;font-size:14px;margin:12px 0 5px;color:#5a4a22;font-weight:600;}
  input,select{width:100%;padding:11px 12px;font-size:15px;border:1px solid #d4c59a;border-radius:8px;background:#fdfbf6;color:#333;}
  .row{display:flex;gap:10px;}
  .row>div{flex:1;}
  .btn{display:block;width:100%;margin-top:18px;padding:13px;background:#8a6d28;color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:active{opacity:.85;}
  .err{color:#b4322a;font-size:13px;margin-top:8px;min-height:18px;}
  .loading{text-align:center;color:#8a7a55;font-size:14px;padding:30px 0;}
  .note{font-size:11.5px;color:#9a8a60;line-height:1.6;margin-top:10px;}
  .hour-unknown{font-size:13px;color:#7a5c1e;display:flex;align-items:center;gap:6px;margin-top:6px;}
  #report{display:none;}
  /* 报告内样式复用 report.js 输出 */
  .back{display:inline-block;margin:0 0 8px;color:#8a6d28;font-size:14px;cursor:pointer;}
  /* 术语点击气泡 */
  .term-mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9998;display:none;align-items:flex-end;justify-content:center;padding:18px;}
  .term-pop{position:relative;width:100%;max-width:440px;background:#fff;border:1px solid #1a5a9a;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;margin-bottom:6px;}
  .tp-x{position:absolute;right:10px;top:6px;color:#999;font-size:20px;cursor:pointer;line-height:1;}
  .tp-h{font-weight:700;color:#1a5a9a;font-size:15px;margin-bottom:6px;padding-right:18px;}
  .tp-b{font-size:13.5px;color:#333;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <div id="form">
    <h1>八字古典考释 · 六维专线</h1>
    <div class="tip">以《易经》《滴天髓》《子平真诠》《穷通宝鉴》《三命通会》《渊海子平》《四柱预测学》等权威典籍为纲 · 无据不妄断</div>
    <div class="card">
      <label>出生日期（公历）</label>
      <div class="row">
        <div><input id="date" type="text" placeholder="如 19880228 或 1988-02-28" value="2000-02-28"></div>
        <div style="flex:0 0 92px;"><button type="button" id="pickDate" style="width:100%;padding:11px 0;background:#cdbf95;color:#4a3c18;border:none;border-radius:8px;font-size:13px;cursor:pointer;">📅 选择</button></div>
      </div>
      <input type="date" id="datePicker" style="display:none;">
      <div class="note" style="margin-top:5px;">支持手写：19880228 / 1988-02-28 / 1988.2.28，或点「选择」调日历。</div>
      <label>出生时间</label>
      <div class="row">
        <div><input id="hour" type="number" min="0" max="23" placeholder="时" value="9"></div>
        <div><input id="min" type="number" min="0" max="59" placeholder="分" value="30"></div>
      </div>
      <div class="hour-unknown"><input id="unknowH" type="checkbox" style="width:auto;"> <label style="margin:0;font-weight:400;font-size:13px;">不清楚出生时辰（自动略去子女宫细节）</label></div>
      <label>性别</label>
      <select id="gender"><option value="女">女</option><option value="男">男</option></select>
      <label>称呼（选填，用于保存与识别历史记录）</label>
      <input id="cname" type="text" placeholder="如 张三 / 李四" maxlength="12">
      <label>查看年份（默认今年，可改看任意年整体运势）</label>
      <input id="year" type="number" min="1900" max="2100" placeholder="如 2026">
      <label>出生地（省市，用于真太阳时校正）</label>
      <div class="row">
        <div><select id="prov"><option value="">— 省/直辖市 —</option></select></div>
        <div><select id="city"><option value="">— 市 —</option></select></div>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="go">生成我的古典考释报告</button>
      <div class="note">选择省市后自动带出当地经度用于真太阳时校正；填不准不影响四柱（只影响时辰微调）。也可在下方手动微调经度。</div>
      <details style="margin-top:8px;">
        <summary style="font-size:12px;color:#8a7a55;cursor:pointer;">手动微调经度（一般情况无需改）</summary>
        <div class="row" style="margin-top:6px;align-items:center;">
          <div><input id="lon" type="number" step="0.1" value="116.3" placeholder="东经度数"></div>
          <button type="button" id="useLon" style="width:auto;padding:10px 12px;background:#cdbf95;color:#4a3c18;border:none;border-radius:8px;font-size:13px;white-space:nowrap;">按手动值</button>
        </div>
      </details>
    </div>
    <div class="card" id="histCard" style="display:none;">
      <div class="card-h" style="background:#f0e4c8;padding:9px 14px;font-weight:700;color:#5a4a22;border-bottom:1px solid #e0d2a8;margin:-14px -14px 10px;">历史记录</div>
      <div id="histList"></div>
      <div style="text-align:right;margin-top:6px;"><span id="clearHist" style="font-size:12px;color:#b4322a;cursor:pointer;">清空历史</span></div>
    </div>
  </div>

  <div id="report">
    <span class="back" id="back">← 返回修改</span>
    <div id="report-body"></div>
  </div>

  <div id="loading" class="loading" style="display:none;">正在排盘与生成古典考释报告…</div>
</div>

<script>
/*
 * engine.js — 八字排盘引擎（纯 JS，无第三方依赖）
 * 算法平移自 xuanxue-bazi/scripts/bazi.py（Meeus 太阳黄经定月令、JDN 定日柱、
 *   五虎遁/五鼠遁、旺衰加权评分、起运=节气距/3），并补齐神煞与十二长生。
 * 兼容 Node(module.exports)、浏览器与小程序的全局引用。
 *
 * 用法：
 *   const bz = require('./engine.js');
 *   const r = bz.compute({ date:'1988-02-28 09:30', gender:'女', longitude:116.3 });
 */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.BaziEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {

  /* ----------------------------- 基础常量 ----------------------------- */
  var GANGS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  var ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

  var ELEMENT = {
    '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土',
    '庚': '金', '辛': '金', '壬': '水', '癸': '水'
  };

  var NAYIN = [
    '海中金', '海中金', '炉中火', '炉中火', '大林木', '大林木',
    '路旁土', '路旁土', '剑锋金', '剑锋金', '山头火', '山头火',
    '涧下水', '涧下水', '城头土', '城头土', '白蜡金', '白蜡金',
    '杨柳木', '杨柳木', '泉中水', '泉中水', '屋上土', '屋上土',
    '霹雳火', '霹雳火', '松柏木', '松柏木', '长流水', '长流水',
    '沙中金', '沙中金', '山下火', '山下火', '平地木', '平地木',
    '壁上土', '壁上土', '金箔金', '金箔金', '覆灯火', '覆灯火',
    '天河水', '天河水', '大驿土', '大驿土', '钗钏金', '钗钏金',
    '桑柘木', '桑柘木', '大溪水', '大溪水', '沙中土', '沙中土',
    '天上火', '天上火', '石榴木', '石榴木', '大海水', '大海水'
  ];

  // 地支藏干（本气在前）
  var ZHI_CANG = {
    '子': ['癸'], '丑': ['己', '癸', '辛'], '寅': ['甲', '丙', '戊'],
    '卯': ['乙'], '辰': ['戊', '乙', '癸'], '巳': ['丙', '庚', '戊'],
    '午': ['丁', '己'], '未': ['己', '丁', '乙'], '申': ['庚', '壬', '戊'],
    '酉': ['辛'], '戌': ['戊', '辛', '丁'], '亥': ['壬', '甲']
  };
  var ZHI_CANG_MAIN = {};
  for (var z in ZHI_CANG) ZHI_CANG_MAIN[z] = ZHI_CANG[z][0];

  // 十二长生顺序
  var CS_ORDER = ['长生', '沐浴', '冠带', '临官', '帝旺', '衰', '病', '死', '墓', '绝', '胎', '养'];
  // 五行长生起点（阳干顺行、阴干逆行）
  var CS_START = { '木': '亥', '火': '寅', '土': '寅', '金': '巳', '水': '申' };

  // 十二节（月令起始）：黄经、月支索引、名称、近似(月,日)
  var JIE = [
    [315, 2, '立春', [2, 4]], [345, 3, '惊蛰', [3, 6]], [15, 4, '清明', [4, 5]],
    [45, 5, '立夏', [5, 6]], [75, 6, '芒种', [6, 6]], [105, 7, '小暑', [7, 7]],
    [135, 8, '立秋', [8, 8]], [165, 9, '白露', [9, 8]], [195, 10, '寒露', [10, 8]],
    [225, 11, '立冬', [11, 7]], [255, 0, '大雪', [12, 7]], [285, 1, '小寒', [1, 6]]
  ];

  // 常用城市经度（东经，度）
  var CITY_LONGITUDE = {
    '北京': 116.4, '上海': 121.47, '广州': 113.26, '深圳': 114.06,
    '揭阳': 116.37, '惠来': 116.30, '汕头': 116.68, '潮州': 116.62,
    '成都': 104.07, '重庆': 106.55, '武汉': 114.30, '西安': 108.95,
    '南京': 118.78, '杭州': 120.15, '沈阳': 123.43, '哈尔滨': 126.63,
    '昆明': 102.71, '贵阳': 106.71, '兰州': 103.83, '乌鲁木齐': 87.62,
    '拉萨': 91.13, '海口': 110.33, '南宁': 108.37, '太原': 112.55,
    '郑州': 113.65, '济南': 117.00, '青岛': 120.38, '福州': 119.30,
    '厦门': 118.10, '南昌': 115.86, '长沙': 112.94, '合肥': 117.27,
    '天津': 117.20, '石家庄': 114.51, '呼和浩特': 111.75, '香港': 114.17,
    '澳门': 113.55, '台北': 121.56
  };

  /* ----------------------------- 工具函数 ----------------------------- */
  function mod(a, n) { return ((a % n) + n) % n; }
  function isYang(stemIdx) { return stemIdx % 2 === 0; }

  function ganzhiIndex(g, z) {
    var gi = GANGS.indexOf(g), zi = ZHI.indexOf(z);
    var p = gi;
    while (mod(p, 12) !== zi) p += 10;
    return mod(p, 60);
  }
  function ganzhi(idx) { return [GANGS[mod(idx, 10)], ZHI[mod(idx, 12)]]; }

  function produces(a, b) {
    var order = ['木', '火', '土', '金', '水'];
    return mod(order.indexOf(a) + 1, 5) === order.indexOf(b);
  }
  function controls(a, b) {
    var ke = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' };
    return ke[a] === b;
  }

  /* --------------------------- 历法 / 天文 --------------------------- */
  function jdFromGreg(y, m, d, hh, mm, ss) {
    hh = hh || 0; mm = mm || 0; ss = ss || 0;
    if (m <= 2) { y -= 1; m += 12; }
    var a = Math.floor(y / 100);
    var b = 2 - a + Math.floor(a / 4);
    var dayFrac = (hh + (mm + ss / 60) / 60) / 24;
    return (Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5 + dayFrac);
  }
  function jdToUtcMs(jd) { return (jd - 2440587.5) * 86400000; }
  // UTC ms -> 北京时间 {y,m,d,h,min}
  function utcMsToBeijing(utcMs) {
    var d = new Date(utcMs + 8 * 3600 * 1000);
    return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), min: d.getUTCMinutes() };
  }
  function beijingToUtcMs(y, m, d, h, min) { return Date.UTC(y, m - 1, d, h - 8, min); }

  function sunApparentLongitude(jd) {
    var T = (jd - 2451545.0) / 36525.0;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var Mr = M * Math.PI / 180;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr)
      + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
      + 0.000289 * Math.sin(3 * Mr);
    var trueLong = L0 + C;
    var Omega = 125.04 - 1934.136 * T;
    var lamb = trueLong - 0.00569 - 0.00478 * Math.sin(Omega * Math.PI / 180);
    return mod(lamb, 360);
  }

  function solarTermJd(year, targetLong, approxMd) {
    if (!approxMd) approxMd = [6, 21];
    var m = approxMd[0], d = approxMd[1];
    var center = jdFromGreg(year, m, d);
    var lo = center - 20, hi = center + 20, step = 0.25, t = lo;
    function diff(lon, target) { return mod(lon - target + 540, 360) - 180; }
    var prev = diff(sunApparentLongitude(t), targetLong);
    while (t < hi) {
      t += step;
      var cur = diff(sunApparentLongitude(t), targetLong);
      if ((prev <= 0 && cur >= 0) || (prev >= 0 && cur <= 0)) {
        var a = t - step, b = t;
        for (var i = 0; i < 60; i++) {
          var mid = (a + b) / 2;
          var v = diff(sunApparentLongitude(mid), targetLong);
          if (v > 0) b = mid; else a = mid;
        }
        return (a + b) / 2;
      }
      prev = cur;
    }
    return null;
  }
  function termBeijing(year, targetLong, approxMd) {
    var jd = solarTermJd(year, targetLong, approxMd);
    if (jd == null) return null;
    return utcMsToBeijing(jdToUtcMs(jd));
  }

  /* ----------------------------- 干支计算 ----------------------------- */
  function yearGanzhi(year) { return [mod(year - 4, 10), mod(year - 4, 12)]; }

  function monthBranchFromLongitude(lon) {
    var L = mod(lon, 360);
    var lp = mod(L - 315, 360);
    var sector = Math.floor(lp / 30);
    return mod(2 + sector, 12);
  }
  function monthStemFromYear(yStem, mBranch) {
    var yinStem = mod(yStem * 2 + 2, 10);
    var steps = mod(mBranch - 2, 12);
    return mod(yinStem + steps, 10);
  }
  function dayGanzhiIndex(y, m, d) {
    if (m <= 2) { y -= 1; m += 12; }
    var a = Math.floor(y / 100);
    var b = 2 - a + Math.floor(a / 4);
    var jdn = (Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5);
    var N = Math.floor(jdn + 0.5);
    return mod(N + 49, 60);
  }
  function hourBranch(hour) { return mod(Math.floor((hour + 1) / 2), 12); }
  function hourStem(dayStem, hBranch) {
    var ziStem = mod(dayStem % 5, 10) * 2;
    return mod(ziStem + hBranch, 10);
  }

  /* --------------------------- 十神 / 五行 --------------------------- */
  function tenGod(dayStemIdx, otherStemIdx) {
    var de = ELEMENT[GANGS[dayStemIdx]], oe = ELEMENT[GANGS[otherStemIdx]];
    var dp = isYang(dayStemIdx), op = isYang(otherStemIdx), same = (dp === op);
    if (de === oe) return same ? '比肩' : '劫财';
    if (produces(oe, de)) return same ? '偏印' : '正印';
    if (produces(de, oe)) return same ? '食神' : '伤官';
    if (controls(de, oe)) return same ? '偏财' : '正财';
    if (controls(oe, de)) return same ? '七杀' : '正官';
    return '?';
  }
  function elementCount(dayGan, pillars) {
    var cnt = { '木': 0, '火': 0, '土': 0, '金': 0, '水': 0 };
    var i;
    for (i = 0; i < 4; i++) {
      var g = pillars[i][0]; cnt[ELEMENT[g]]++;
      var z = pillars[i][1]; cnt[ELEMENT[ZHI_CANG_MAIN[z]]]++;
    }
    return cnt;
  }
  function dayMasterStrength(dayStemIdx, pillars) {
    var de = ELEMENT[GANGS[dayStemIdx]], dp = isYang(dayStemIdx);
    var score = 0;
    // 月令（权重最高）
    var mMain = ELEMENT[ZHI_CANG_MAIN[pillars[1][1]]];
    if (mMain === de) score += 3;
    else if (produces(mMain, de)) score += 1.5;
    else if (produces(de, mMain)) score -= 1;
    else if (controls(de, mMain)) score -= 0.5;
    else if (controls(mMain, de)) score -= 2;
    // 天干（除日主）
    for (var i = 0; i < 4; i++) {
      if (i === 2) continue;
      var g = pillars[i][0], ge = ELEMENT[g], op = isYang(GANGS.indexOf(g)), same = (dp === op);
      if (ge === de) score += 1;
      else if (produces(ge, de)) score += 0.8;
      else if (produces(de, ge)) score -= 0.6;
      else if (controls(de, ge)) score -= 0.3;
      else if (controls(ge, de)) score -= 1;
    }
    // 地支本气（除月令）
    for (i = 0; i < 4; i++) {
      if (i === 1) continue;
      var z = pillars[i][1], ze = ELEMENT[ZHI_CANG_MAIN[z]];
      if (ze === de) score += 1;
      else if (produces(ze, de)) score += 0.8;
      else if (produces(de, ze)) score -= 0.5;
      else if (controls(de, ze)) score -= 0.3;
      else if (controls(ze, de)) score -= 1;
    }
    var label;
    if (score >= 3) label = '身强（偏旺）';
    else if (score > 0) label = '中和偏旺';
    else if (score <= -3) label = '身弱（偏弱）';
    else if (score < 0) label = '中和偏弱';
    else label = '中和';
    return { score: Math.round(score * 100) / 100, label: label };
  }
  function usefulGod(dayStemIdx, strengthLabel) {
    var de = ELEMENT[GANGS[dayStemIdx]];
    var order = ['木', '火', '土', '金', '水'];
    var shengWo = order[mod(order.indexOf(de) - 1, 5)];
    var woSheng = order[mod(order.indexOf(de) + 1, 5)];
    var ke = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' };
    var woKe = ke[de];
    var keWo = order[mod(order.indexOf(de) - 2, 5)];
    if (strengthLabel.indexOf('身强') === 0 || strengthLabel === '中和偏旺') {
      return { xi: [keWo, woSheng, woKe], ji: [de, shengWo], principle: '身强宜克泄耗' };
    } else if (strengthLabel.indexOf('身弱') === 0 || strengthLabel === '中和偏弱') {
      return { xi: [de, shengWo], ji: [keWo, woSheng, woKe], principle: '身弱宜生扶' };
    }
    return { xi: [de, shengWo, keWo, woSheng], ji: [], principle: '中和，宜结合全局取用' };
  }

  /* ----------------------------- 大运 / 流年 ----------------------------- */
  function findBoundaryTerm(birthBJms, forward, year) {
    var cands = [];
    var yrs = [year - 1, year, year + 1];
    for (var yi = 0; yi < yrs.length; yi++) {
      for (var ji = 0; ji < JIE.length; ji++) {
        var t = termBeijing(yrs[yi], JIE[ji][0], JIE[ji][3]);
        if (t) cands.push({ ms: beijingToUtcMs(t.y, t.m, t.d, t.h, t.min) + 8 * 3600 * 1000, name: JIE[ji][2] });
      }
    }
    cands.sort(function (a, b) { return a.ms - b.ms; });
    var k;
    if (forward) { for (k = 0; k < cands.length; k++) if (cands[k].ms > birthBJms) return cands[k]; }
    else { for (k = cands.length - 1; k >= 0; k--) if (cands[k].ms < birthBJms) return cands[k]; }
    return null;
  }
  function computeDaYun(birthBJms, birthYear, yStem, mStem, mBranch, dayStemIdx, forward, count) {
    var term = findBoundaryTerm(birthBJms, forward, birthYear);
    if (!term) return { list: [], start: null };
    var days = Math.abs(term.ms - birthBJms) / 86400000;
    var startAge = days / 3;
    var years = Math.floor(startAge);
    var months = Math.round((startAge - years) * 12);
    var list = [];
    for (var k = 1; k <= count; k++) {
      var s = forward ? mod(mStem + k, 10) : mod(mStem - k, 10);
      var b = forward ? mod(mBranch + k, 12) : mod(mBranch - k, 12);
      var age = startAge + (k - 1) * 10;
      var sName = GANGS[s], bName = ZHI[b];
      list.push({
        index: k, gan: sName, zhi: bName, pillar: sName + bName,
        ten_god: tenGod(dayStemIdx, s), nayin: NAYIN[ganzhiIndex(sName, bName)],
        start_age: Math.round(age * 10) / 10, end_age: Math.round((age + 10) * 10) / 10
      });
    }
    return { list: list, start: { age_years: years, age_months: months, term_name: term.name } };
  }
  function computeLiuNian(birthYear, refYear, dayStemIdx, daYun, count) {
    var result = [];
    for (var off = 0; off < (count || 10); off++) {
      var y = refYear + off;
      var s = mod(y - 4, 10), b = mod(y - 4, 12);
      var age = y - birthYear;
      var active = null;
      for (var i = 0; i < daYun.length; i++) {
        if (daYun[i].start_age <= age && age < daYun[i].end_age) { active = daYun[i].pillar; break; }
      }
      result.push({ year: y, gan: GANGS[s], zhi: ZHI[b], pillar: GANGS[s] + ZHI[b], ten_god: tenGod(dayStemIdx, s), age: age, active_dayun: active });
    }
    return result;
  }

  /* ------------------------------- 神煞 ------------------------------- */
  // 天乙贵人（日干 / 年干同规则）：返回地支数组
  function tianyi(stem) {
    var map = {
      '甲': ['丑', '未'], '戊': ['丑', '未'], '庚': ['丑', '未'],
      '乙': ['子', '申'], '己': ['子', '申'],
      '丙': ['亥', '酉'], '丁': ['亥', '酉'],
      '壬': ['卯', '巳'], '癸': ['卯', '巳'],
      '辛': ['寅', '午']
    };
    return map[stem] || [];
  }
  // 三合局 -> 驿马/华盖/咸池
  var SANHE = {
    '申子辰': { ma: '寅', hua: '辰', tao: '酉' },
    '寅午戌': { ma: '申', hua: '戌', tao: '卯' },
    '亥卯未': { ma: '巳', hua: '未', tao: '子' },
    '巳酉丑': { ma: '亥', hua: '丑', tao: '午' }
  };
  function sanheLookup(zhi) {
    var keys = Object.keys(SANHE);
    for (var i = 0; i < keys.length; i++) if (keys[i].indexOf(zhi) >= 0) return SANHE[keys[i]];
    return null;
  }
  function yima(zhi) { var s = sanheLookup(zhi); return s ? s.ma : null; }
  function huagai(zhi) { var s = sanheLookup(zhi); return s ? s.hua : null; }
  function taohua(zhi) { var s = sanheLookup(zhi); return s ? s.tao : null; }
  // 文昌
  function wenchange(stem) {
    var map = { '甲': '巳', '乙': '午', '丙': '申', '戊': '申', '丁': '酉', '己': '酉', '庚': '亥', '辛': '子', '壬': '寅', '癸': '卯' };
    return map[stem] || null;
  }
  // 红鸾（年支）
  var HONGLUAN = { '子': '卯', '丑': '寅', '寅': '丑', '卯': '子', '辰': '亥', '巳': '戌', '午': '酉', '未': '申', '申': '未', '酉': '午', '戌': '巳', '亥': '辰' };
  function hongluan(zhi) { return HONGLUAN[zhi] || null; }
  function tianxi(zhi) { var h = hongluan(zhi); return h ? ZHI[mod(ZHI.indexOf(h) + 6, 12)] : null; }

  // 十二长生（阴阳干顺逆）
  function changsheng(dayElement, dayYang, zhi) {
    var startZhi = CS_START[dayElement];
    var startIdx = ZHI.indexOf(startZhi);
    var zhiIdx = ZHI.indexOf(zhi);
    var steps = dayYang ? mod(zhiIdx - startIdx, 12) : mod(startIdx - zhiIdx, 12);
    return CS_ORDER[steps];
  }

  /* ------------------------------- 主流程 ------------------------------- */
  function parseGender(g) {
    g = (g || '').toString().trim();
    if (['男', 'male', 'M', 'm'].indexOf(g) >= 0) return 'male';
    if (['女', 'female', 'F', 'f'].indexOf(g) >= 0) return 'female';
    throw new Error('性别需为 男/male 或 女/female');
  }

  function compute(input) {
    input = input || {};
    var gender = parseGender(input.gender);
    var ds = (input.date || '').trim();
    // 用正则解析 YYYY-MM-DD HH:MM
    var m = ds.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?$/);
    if (!m) throw new Error('日期格式应为 YYYY-MM-DD 或 YYYY-MM-DD HH:MM');
    var y = +m[1], mo = +m[2], d = +m[3], h = m[4] ? +m[4] : 0, mi = m[5] ? +m[5] : 0;
    var birthBJms = beijingToUtcMs(y, mo, d, h, mi) + 8 * 3600 * 1000; // 北京时刻的"时间戳"
    var birthYear = y;

    // 经度 / 真太阳时
    var longitude = input.longitude != null ? +input.longitude : null;
    var trueSolar = null;
    if (input.place && longitude == null) longitude = CITY_LONGITUDE[input.place.trim()] || null;
    var birthHour = h;
    if (longitude != null) {
      var n = Math.floor((Date.UTC(y, mo - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
      var bb = 2 * Math.PI / 365.24 * (n - 1);
      var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(bb) - 0.032077 * Math.sin(bb)
        - 0.014615 * Math.cos(2 * bb) - 0.040849 * Math.sin(2 * bb));
      var lonOff = (longitude - 120) * 4;
      var totalMin = (h * 60 + mi) + lonOff + eot;
      totalMin = mod(totalMin, 1440);
      birthHour = Math.floor(totalMin / 60);
      trueSolar = {
        longitude: longitude, place: input.place || null,
        beijing_time: y + '-' + mo + '-' + d + ' ' + h + ':' + (mi < 10 ? '0' + mi : mi),
        true_solar_time: '校正后约 ' + birthHour + ':' + (Math.round(totalMin % 60) < 10 ? '0' : '') + Math.round(totalMin % 60),
        lon_offset_min: Math.round(lonOff * 10) / 10, eot_min: Math.round(eot * 10) / 10
      };
    }

    // 太阳黄经（UTC 时刻）
    var dtUtc = new Date(beijingToUtcMs(y, mo, d, h, mi));
    var birthJdUtc = jdFromGreg(dtUtc.getUTCFullYear(), dtUtc.getUTCMonth() + 1, dtUtc.getUTCDate(), dtUtc.getUTCHours(), dtUtc.getUTCMinutes(), dtUtc.getUTCSeconds());

    // 年柱（与当年立春比较）
    var lichun = termBeijing(y, 315, [2, 4]);
    var lichunMs = lichun ? beijingToUtcMs(lichun.y, lichun.m, lichun.d, lichun.h, lichun.min) + 8 * 3600 * 1000 : null;
    var yG, yZ;
    if (lichunMs && birthBJms >= lichunMs) { var yg = yearGanzhi(y); yG = yg[0]; yZ = yg[1]; }
    else { var yg2 = yearGanzhi(y - 1); yG = yg2[0]; yZ = yg2[1]; }

    // 月柱
    var lon = sunApparentLongitude(birthJdUtc);
    var mBranch = monthBranchFromLongitude(lon);
    var mStem = monthStemFromYear(yG, mBranch);

    // 日柱
    var dIdx = dayGanzhiIndex(y, mo, d);
    var dg = GANGS[mod(dIdx, 10)], dz = ZHI[mod(dIdx, 12)];
    var dayStemIdx = mod(dIdx, 10);

    // 时柱
    var hBranch = hourBranch(birthHour);
    var hStem = hourStem(dayStemIdx, hBranch);

    var pillars = [
      [GANGS[yG], ZHI[yZ]],
      [GANGS[mStem], ZHI[mBranch]],
      [dg, dz],
      [GANGS[hStem], ZHI[hBranch]]
    ];

    var dayMaster = dg;
    var dmElement = ELEMENT[dayMaster];
    var dmYang = isYang(dayStemIdx);

    var wuxing = elementCount(dayMaster, pillars);
    var tgMap = [
      tenGod(dayStemIdx, GANGS.indexOf(pillars[0][0])),
      tenGod(dayStemIdx, GANGS.indexOf(pillars[1][0])),
      '日主',
      tenGod(dayStemIdx, GANGS.indexOf(pillars[3][0]))
    ];
    var strength = dayMasterStrength(dayStemIdx, pillars);
    var ug = usefulGod(dayStemIdx, strength.label);

    var shengxiao = ZHI[yZ];
    var nayin = [
      NAYIN[ganzhiIndex(pillars[0][0], pillars[0][1])],
      NAYIN[ganzhiIndex(pillars[1][0], pillars[1][1])],
      NAYIN[ganzhiIndex(pillars[2][0], pillars[2][1])],
      NAYIN[ganzhiIndex(pillars[3][0], pillars[3][1])]
    ];
    // 空亡（以日柱）
    var dB = ZHI.indexOf(dz);
    var kongwang = [ZHI[mod(dB - dayStemIdx + 10, 12)], ZHI[mod(dB - dayStemIdx + 11, 12)]];

    // 大运
    var forward = (isYang(yG) && gender === 'male') || (!isYang(yG) && gender === 'female');
    var dy = computeDaYun(birthBJms, birthYear, yG, mStem, mBranch, dayStemIdx, forward, input.count || 10);

    // 流年
    var refYear = input.refYear || new Date().getFullYear();
    var liuNian = computeLiuNian(birthYear, refYear, dayStemIdx, dy.list, 10);

    // 神煞（以日干、年支、日支）
    var dayZhi = dz;
    var shenSha = {
      tianyi: [].concat(tianyi(dayMaster), tianyi(GANGS[yG])),
      yima: yima(ZHI[yZ]),
      huagai: huagai(ZHI[yZ]),
      taohua: taohua(ZHI[yZ]),
      wenchange: wenchange(dayMaster),
      hongluan: hongluan(ZHI[yZ]),
      tianxi: tianxi(ZHI[yZ]),
      // 十二长生（日主五行在四支的状态）
      changsheng: {
        year: changsheng(dmElement, dmYang, pillars[0][1]),
        month: changsheng(dmElement, dmYang, pillars[1][1]),
        day: changsheng(dmElement, dmYang, pillars[2][1]),
        hour: changsheng(dmElement, dmYang, pillars[3][1])
      }
    };
    // 去重天乙贵人
    shenSha.tianyi = shenSha.tianyi.filter(function (v, i, a) { return a.indexOf(v) === i; });

    return {
      input: { date: y + '-' + mo + '-' + d + ' ' + h + ':' + (mi < 10 ? '0' + mi : mi), gender: gender === 'male' ? '男' : '女', longitude: longitude, true_solar: trueSolar },
      bazi: { year: pillars[0][0] + pillars[0][1], month: pillars[1][0] + pillars[1][1], day: pillars[2][0] + pillars[2][1], hour: pillars[3][0] + pillars[3][1] },
      pillars_detail: {
        year: { gan: pillars[0][0], zhi: pillars[0][1], ten_god: tgMap[0], nayin: nayin[0] },
        month: { gan: pillars[1][0], zhi: pillars[1][1], ten_god: tgMap[1], nayin: nayin[1] },
        day: { gan: pillars[2][0], zhi: pillars[2][1], ten_god: '日主', nayin: nayin[2] },
        hour: { gan: pillars[3][0], zhi: pillars[3][1], ten_god: tgMap[3], nayin: nayin[3] }
      },
      day_master: { gan: dayMaster, element: dmElement, polarity: dmYang ? '阳' : '阴' },
      wuxing: wuxing,
      strength: strength,
      useful_god: ug,
      shengxiao: shengxiao,
      kongwang: kongwang,
      da_yun: { forward: forward ? '顺排' : '逆排', start: dy.start, list: dy.list },
      liu_nian: liuNian,
      shen_sha: shenSha,
      ref_year: refYear,
      meta: { engine: 'js-bazi v1', note: '旺衰/用神为初判，仅供文化娱乐参考' }
    };
  }

  return { compute: compute, GANGS: GANGS, ZHI: ZHI, ELEMENT: ELEMENT, NAYIN: NAYIN, tenGod: tenGod };
});

  // 供「六维详考」「当年运势」共用。report.js 为独立 UMD，不依赖 engine 内部函数，故在此自备。

  function tenGodOf(dayGan, otherGan) {

      if (DIZHI_HAI[z]) push({ type: '害', text: z + '害' + DIZHI_HAI[z], parts: [z, DIZHI_HAI[z]] }, i, DIZHI_HAI[z]);

  // 大运干支五行映射
  var GAN_EL = { '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水' };
  var ZHI_EL = { '寅': '木', '卯': '木', '巳': '火', '午': '火', '辰': '土', '戌': '土', '丑': '土', '未': '土', '申': '金', '酉': '金', '亥': '水', '子': '水' };
  // 大运十神对用神的粗判（印比=生扶，财官食伤=克泄耗）
  var SHENG_FU = ['正印', '偏印', '比肩', '劫财'];

  // 大运综合吉凶：结合日主强弱、天干十神、地支五行喜忌，给出五级标签+通俗解释
  function dayunStatus(r, d) {
    var score = 0;
    var tg = d.ten_god;
    var isWeak = r.strength.score <= -1.5;
    var isStrong = r.strength.score >= 1.5;

    // 天干十神打分
    if (inArr(SHENG_FU, tg)) {
      if (isWeak) score += 2;      // 身弱得生扶 → 吉
      else if (isStrong) score -= 2; // 身强再生扶 → 凶
    } else if (inArr(KE_XIE, tg)) {
      if (isStrong) score += 2;    // 身强得克泄耗 → 吉
      else if (isWeak) score -= 2; // 身弱被克泄耗 → 凶
    }

    // 地支五行打分
    var zhi = d.zhi || (d.pillar && d.pillar.charAt(1));
    var zEl = ZHI_EL[zhi];
    if (zEl) {
      if (inArr(r.useful_god.xi, zEl)) score += 1;
      if (inArr(r.useful_god.ji, zEl)) score -= 1;
    }

    var status;
    if (score >= 3) status = { label: '大吉', cls: 'tag-daji' };
    else if (score >= 1) status = { label: '吉', cls: 'tag-ji' };
    else if (score >= -1) status = { label: '平', cls: 'tag-ping' };
    else if (score >= -2) status = { label: '小凶', cls: 'tag-xiaoxiong' };
    else status = { label: '凶', cls: 'tag-xiong' };

    return { score: score, label: status.label, cls: status.cls, text: dayunText(r, d, status.label) };
  }

  function dayunText(r, d, label) {
    var tg = d.ten_god;
    var isWeak = r.strength.score <= -1.5;
    var isStrong = r.strength.score >= 1.5;
    if (label === '大吉' || label === '吉') {
      if (inArr(SHENG_FU, tg)) {
        if (tg.indexOf('印') >= 0) return '贵人、平台、学历运旺，利深造、考证、得长辈/领导提携';
        return '同辈朋友、合作者助力多，利团队、合伙、人脉扩张';
      }
      if (tg.indexOf('财') >= 0) return '财运上扬，收入渠道拓宽，利经营、投资、加薪';
      if (tg.indexOf('官') >= 0 || tg.indexOf('杀') >= 0) return '事业心强、机会多，利升职、掌权、建立影响力';
      if (tg.indexOf('食') >= 0 || tg.indexOf('伤') >= 0) return '才华输出顺畅，利创作、表达、技艺变现、口碑传播';
      return '整体顺遂，可主动进取';
    }
    if (label === '小凶' || label === '凶') {
      if (inArr(SHENG_FU, tg)) {
        return '帮扶太过反成竞争、依赖或惰性，宜独立深耕、少借贷担保';
      }
      if (tg.indexOf('财') >= 0) return '求财辛苦或财来财去，不宜大额投资、高杠杆';
      if (tg.indexOf('官') >= 0 || tg.indexOf('杀') >= 0) return '压力、责任、约束重，易有口舌或健康透支，宜守成减压';
      if (tg.indexOf('食') >= 0 || tg.indexOf('伤') >= 0) return '付出多回报慢，表达易招是非，宜低调积累';
      return '阻力偏大，宜稳不宜急';
    }
    // 平
    return '运势中和，吉凶参半，随流年起伏，宜稳中求进';
  }

    items.push(g1);

    // 2 姻缘
    var g2 = '<b>姻缘</b>：' + (isMale ? '妻星（财）' : '夫星（官杀）') + (['year', 'month', 'hour'].some(function (p) { return inArr(spouseStar, pd[p].ten_god); }) ? '得位有依' : '不显，缘迟待引');
    if (!isMale && hasZhengGuan && hasQiSha) g2 += '，官杀混杂+夫妻宫（' + branchMainGod(pd.day.zhi, dm) + '），传统安稳婚姻难度偏高；非无姻缘，宜精神对等、契约清晰，不宜强求传统夫妻生活';
    else if (!isMale && inArr(['正官', '七杀'], branchMainGod(pd.day.zhi, dm))) g2 += '，夫妻宫坐' + branchMainGod(pd.day.zhi, dm) + '，配偶刚强带压力，宜多沟通';
    else g2 += '，宫星相得则和、相战则波，宜务实经营';
    g2 += '。';
    items.push(g2);

    // 3 事业
    var g3 = '<b>事业</b>：' + (inArr(missing, yinEl) ? '贵在补印（' + yinEl + '），成在比劫' : '贵在印星得用、成在食伤泄秀') + '；';
    if (pd.month.ten_god.indexOf('伤官') >= 0 || pd.month.ten_god.indexOf('食神') >= 0) g3 += '食伤当令，适合专家、专业服务、教育顾问、技术复合路径，不宜执念名义实权。';
    else if (inArr(['正官', '七杀'], pd.month.ten_god)) g3 += '官杀当令，适合管理、项目统筹、商务复合路径，靠资历与体系立身。';
    else g3 += '宜凭专业与平台稳进，不宜单打独斗创业。';
    items.push(g3);

    // 4 健康
    var g4 = '<b>健康</b>：' + (missing.length ? ('缺 ' + missing.join('、') + '（' + missing.map(function (e) { return ORGAN[e]; }).join('、') + '）为固定应象') : '五行俱全，留意最弱一行');
    var xch0 = detectXingChongHe([pd.year.zhi, pd.month.zhi, pd.day.zhi, pd.hour.zhi]);
    if (xch0.length) g4 += '，原局' + xch0.map(function (x) { return x.text; }).join('、') + '所涉脏腑易现慢性内伤';
    g4 += '，属逢压力必触发的慢性应象，以现代医学防护为准。';
    items.push(g4);

    // 5 财运
    var caiPos = ['year', 'month', 'hour'].some(function (p) { return inArr(['正财', '偏财'], pd[p].ten_god); });
    var g5 = '<b>财运</b>：' + (caiPos ? '财星透出但' + (shenWeak ? '身弱不胜财，劳而后得、财来财去' : '身强可胜，行财乡称意') : '财星不显，非暴发之局、须运引方现') + '，宜' + (shenWeak ? '守财重于求财、忌投机' : '稳健经营、靠专业稳财') + '。';
    items.push(g5);

    var html = '<div class="card"><div class="card-h">八 · 原局核心结论（五典依据，无套话）</div><div class="card-b"><ol class="ul">';
    items.forEach(function (it) { html += '<li>' + it + '</li>'; });
    html += '</ol></div></div>';
    return { html: html };
  }

  /* ============================ 未来流年 ============================ */
  function buildFuture(r) {
    var ln = r.liu_nian;
    var ss = r.shen_sha;
    var pd = r.pillars_detail;
    var dayZhi = pd.day.zhi;
    var html = '<div class="card"><div class="card-h">五 · 未来流年（' + ln[0].year + '–' + ln[ln.length - 1].year + '）</div><div class="card-b">';
    html += '<table class="grid"><tr><th>流年</th><th>干支</th><th>十神</th><th>年龄</th><th>行运</th><th>应象提示</th></tr>';
    ln.forEach(function (y) {
      var tip = liuNianTip(r, y, ss, dayZhi);
      html += '<tr><td>' + y.year + '</td><td><b>' + y.pillar + '</b></td><td>' + y.ten_god + '</td><td>' + y.age + '岁</td><td>' + (y.active_dayun || '—') + '</td><td>' + tip + '</td></tr>';
    });
    html += '</table>';
    html += '<p class="cite">「' + QUOTE.sizhu_liunian.s + '」' + QUOTE.sizhu_liunian.t + '</p>';
    // 关键年点评
    var key = [];
    ln.forEach(function (y) {
      var t = liuNianKey(r, y, ss, dayZhi);
      if (t) key.push({ y: y, t: t });
    });
    if (key.length) {
      html += '<p class="sub">关键流年详考：</p><ul class="ul">';
      key.forEach(function (k) {
        html += '<li><b>' + k.y.year + '（' + k.y.pillar + '，' + k.y.age + '岁）</b>：' + k.t + '</li>';
      });
      html += '</ul>';
    }
    html += '</div></div>';
    return { html: html };
  }
  function liuNianTip(r, y, ss, dayZhi) {
    var tips = [];
    // 岁运并临
    if (y.pillar === y.active_dayun) tips.push('岁运并临，当年气力加倍，吉凶皆显');
    // 桃花
    if (y.zhi === ss.taohua) tips.push('桃花（' + ss.taohua + '）动');
    // 红鸾
    if (y.zhi === ss.hongluan) tips.push('红鸾动，姻缘信号强');
    // 冲日支（夫妻宫）
    var chong = { '子': '午', '午': '子', '丑': '未', '未': '丑', '寅': '申', '申': '寅', '卯': '酉', '酉': '卯', '辰': '戌', '戌': '辰', '巳': '亥', '亥': '巳' };
    if (chong[y.zhi] === dayZhi) tips.push('冲夫妻宫（' + dayZhi + '），感情有波动');
    // 用神年
    var el = { '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水' }[y.gan];
    if (inArr(r.useful_god.xi, el)) tips.push('干支五行属喜用');
    if (inArr(r.useful_god.ji, el)) tips.push('干支五行属忌神，宜守');
    return tips.length ? tips.join('；') : '平流年，随大运起伏';
  }
  function liuNianKey(r, y, ss, dayZhi) {
    var el = { '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土', '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水' }[y.gan];
    var isMale = r.input.gender === '男';
    // 红鸾 + 配偶星 → 正缘窗
    var spouseStar = isMale ? ['正财', '偏财'] : ['正官', '七杀'];
    if (y.zhi === ss.hongluan && inArr(spouseStar, y.ten_god)) return '红鸾值配偶星，最强正缘定局之窗';
    if (y.pillar === y.active_dayun) return '岁运并临，当年气力最盛，所行大运吉凶于此年集中体现，宜把握亦防冲克';
    if (inArr(r.useful_god.xi, el) && y.ten_god.indexOf('印') >= 0) return '喜用印星到位，贵人、平台、资质运最强之年';
    var chong = { '子': '午', '午': '子', '丑': '未', '未': '丑', '寅': '申', '申': '寅', '卯': '酉', '酉': '卯', '辰': '戌', '戌': '辰', '巳': '亥', '亥': '巳' };
    if (chong[y.zhi] === dayZhi) return '流年冲夫妻宫，感情易有信号或波动，已婚者宜多沟通';
    return null;
  }

  /* ============================ 当年（指定年）整体运势说明 ============================ */
  function buildYearly(r, opts) {
    opts = opts || {};
    var year = opts.year || r.ref_year;
    var yG = mod10(year - 4, 10), yZ = mod10(year - 4, 12);
    var lyGan = GANGS10[yG], lyZhi = ZHI12[yZ];
    var lyPillar = lyGan + lyZhi;
    var dayGan = r.day_master.gan;
    var lyTenGod = tenGodOf(dayGan, lyGan);
    var lyGanEl = ELEM10[lyGan], lyZhiEl = ZHI_EL[lyZhi];
    var pd = r.pillars_detail;
    var isMale = r.input.gender === '男';
    var xi = r.useful_god.xi, ji = r.useful_god.ji;

    // 最弱五行（健康用）
    var weakest = null, wv = 99;
    ['木', '火', '土', '金', '水'].forEach(function (e) { if (r.wuxing[e] > 0 && r.wuxing[e] < wv) { wv = r.wuxing[e]; weakest = e; } });

    // 所在大运
    var birthYear = parseInt(r.input.date, 10);
    var age = year - birthYear;
    var active = null;
    r.da_yun.list.forEach(function (d) { if (d.start_age <= age && age < d.end_age) { active = d.pillar; } });

    // 刑冲合会（命局四柱 + 流年支）
    var xch = detectXingChongHe([pd.year.zhi, pd.month.zhi, pd.day.zhi, pd.hour.zhi], lyZhi);

    // 五行生克（局部）
    var wxProd = function (a, b) { var o = ['木', '火', '土', '金', '水']; return mod10(o.indexOf(a) + 1, 5) === o.indexOf(b); };
    var wxCtrl = function (a, b) { var ke = { '木': '土', '土': '水', '水': '火', '火': '金', '金': '木' }; return ke[a] === b; };

    // —— 综合评级 ——
    var score = 0;
    if (inArr(xi, lyGanEl)) score += 2; else if (inArr(ji, lyGanEl)) score -= 2;
    if (inArr(xi, lyZhiEl)) score += 1; else if (inArr(ji, lyZhiEl)) score -= 1;
    if (lyPillar === active) score = score === 0 ? 0 : score * 2; // 岁运并临加倍
    xch.forEach(function (x) {
      if (x.type === '三合') { if (inArr(xi, x.el)) score += 1.5; else if (inArr(ji, x.el)) score -= 1.5; }
      else if (x.type === '刑' || x.type === '害') { score -= 1; }
      else if (x.type === '冲') {
        var tgt = DIZHI_CHONG[lyZhi];
        if (DIZHI_CHONG[lyZhi] === pd.day.zhi || DIZHI_CHONG[lyZhi] === pd.hour.zhi) score -= 1; // 冲夫妻宫/子女宫
        if (tgt) { var tEl = ZHI_EL[tgt]; if (inArr(ji, tEl)) score += 1; else if (inArr(xi, tEl)) score -= 1; } // 冲去忌神反吉
      } else if (x.type === '合') { score -= 0.5; }
    });
    var rating, cls;
    if (score >= 3) { rating = '大吉'; cls = 'tag-daji'; }
    else if (score >= 1) { rating = '吉'; cls = 'tag-ji'; }
    else if (score >= -1) { rating = '平'; cls = 'tag-ping'; }
    else if (score >= -2) { rating = '小凶'; cls = 'tag-xiaoxiong'; }
    else { rating = '凶'; cls = 'tag-xiong'; }
    var suggest = (rating === '大吉' || rating === '吉') ? '顺势进取、宜把握机会' : (rating === '平' ? '平稳过渡、稳中求进' : '守成为上、宜静不宜动');

    // 岁运关系
    var relTxt = '';
    if (active) {
      if (lyPillar === active) relTxt = '岁运并临（当年干支与大运相同，吉凶加倍明显）';
      else {
        var aG = GAN_EL[active.charAt(0)], aZ = ZHI_EL[active.charAt(1)];
        if (wxProd(lyGanEl, aG) && wxProd(lyZhiEl, aZ)) relTxt = '岁运相生，顺势而为';
        else if (wxCtrl(lyGanEl, aG) || wxCtrl(lyZhiEl, aZ)) relTxt = '岁运相战，宜守不宜攻';
        else relTxt = '岁运平稳';
      }
    }

    // —— 六维分项（白话）——
    var spouseStar = isMale ? ['正财', '偏财'] : ['正官', '七杀'];
    var childStar = isMale ? ['正官', '七杀'] : ['食神', '伤官'];

    // 事业
    var career = [];
    if (inArr(['正官', '七杀'], lyTenGod)) career.push('事业机会与压力并存，' + (inArr(xi, lyGanEl) || inArr(xi, lyZhiEl) ? '宜主动争取上位' : '宜稳守、防责任过载'));
    else if (inArr(['正印', '偏印'], lyTenGod)) career.push('印星之年，利资质、平台、贵人提携' + (inArr(ji, lyGanEl) ? '（但印非喜用，助力有限）' : ''));
    else if (inArr(['食神', '伤官'], lyTenGod)) career.push('食伤之年，才华外显、利表达技艺与口碑传播');
    else if (inArr(['正财', '偏财'], lyTenGod)) career.push('财星之年，事业与收益直接挂钩');
    else career.push('比劫之年，宜团队合伙、忌单打独斗争利');
    if (xch.some(function (x) { return x.parts.indexOf(pd.month.zhi) >= 0; })) career.push('且流年引动月柱（事业/平台宫），宜防上级、制度、平台内耗');

    // 财运
    var wealth = [];
    if (inArr(['正财', '偏财'], lyTenGod)) wealth.push('财星透出，收入有动' + (inArr(ji, lyGanEl) ? '，但财为忌神，财来财去宜守' : '，宜把握'));
    else wealth.push('财星不透，财运随事业走、忌大额投机');
    if (inArr(['比肩', '劫财'], lyTenGod)) wealth.push('比劫分财，合作防分利、忌担保借贷');

    // 姻缘
    var love = [];
    if (inArr(spouseStar, lyTenGod)) love.push('配偶星（' + lyTenGod + '）透出，异性缘/婚恋信号明显');
    else love.push('配偶星不透，姻缘平淡或待机');
    if (lyZhi === r.shen_sha.hongluan) love.push('红鸾值年，最强姻缘喜庆之期');
    if (DIZHI_CHONG[lyZhi] === pd.day.zhi) love.push('冲夫妻宫，感情易有波动、已婚者多沟通');
    else if (DIZHI_HE[lyZhi] === pd.day.zhi) love.push('与夫妻宫相合，感情有进展契机');

    // 子女
    var child = [];
    if (inArr(childStar, lyTenGod)) child.push('子女星（' + lyTenGod + '）动，与子女互动/教育事多');
    else child.push('子女星不动，子女运平稳');
    if (DIZHI_CHONG[lyZhi] === pd.hour.zhi) child.push('冲子女宫，育儿宜多用心');

    // 家庭
    var family = [];
    if (DIZHI_CHONG[lyZhi] === pd.year.zhi || DIZHI_CHONG[lyZhi] === pd.month.zhi) family.push('流年冲年月柱（父母/根基宫），家门易有变动、宜多关照长辈');
    else if (DIZHI_HE[lyZhi] === pd.year.zhi || DIZHI_HE[lyZhi] === pd.month.zhi) family.push('流年合年月柱，家庭和睦、易有团聚或添丁之喜');
    else family.push('家庭宫平稳，无大波动');

    // 健康
    var miss = []; ['木', '火', '土', '金', '水'].forEach(function (e) { if (r.wuxing[e] === 0) miss.push(e); });
    var health = [];
    if (xch.some(function (x) { return x.type === '刑' || x.type === '害'; })) health.push('流年引动刑害，命局自带慢性内耗之象易触发（压力大、休息不足时明显）');
    if (inArr(miss, lyGanEl) || inArr(miss, lyZhiEl)) { var me = inArr(miss, lyGanEl) ? lyGanEl : lyZhiEl; health.push('流年五行恰为命局所缺（' + me + '），对应 ' + ORGAN[me] + ' 需格外养护'); }
    else health.push('无特别冲克，按原局体质倾向日常养护即可（' + ORGAN[weakest] + '）');

    // —— 组装 HTML（year-box 卡片版式，参考深度版）——
    var xchTxt = xch.length ? xch.map(function (x) { return x.text; }).join('、') : '命局无额外刑冲合会引动';
    var html = '<div class="card"><div class="card-h">六 · 当年（' + year + '年）整体运势说明</div><div class="card-b">';
    html += '<div class="year-box">';
    html += '<p class="yb-h">📅 ' + year + ' ' + lyPillar + '年 · ' + (opts.name ? esc(opts.name) + ' ' : '') + age + ' 岁 · 行' + (active || '—') + '大运</p>';
    html += '<p style="margin:6px 0 10px;">本年你是<b>' + (inArr(xi, lyGanEl) || inArr(xi, lyZhiEl) ? '喜用到位' : (inArr(ji, lyGanEl) || inArr(ji, lyZhiEl) ? '忌神当旺' : '中和之年')) + '</b>：流年 ' + lyPillar + '（' + lyTenGod + '，' + lyGanEl + '干/' + lyZhiEl + '支），与命中喜用（' + xi + '）' + (inArr(ji, lyGanEl) || inArr(ji, lyZhiEl) ? '背道而驰' : (inArr(xi, lyGanEl) || inArr(xi, lyZhiEl) ? '相合' : '无大冲犯')) + '，整体基调是"' + suggest + '"。</p>';
    html += '<div class="yb-row"><div class="yb-k">🌟 综合评级</div><div class="yb-v"><span class="tag ' + cls + '">' + rating + ' · ' + suggest + '</span>　' + (inArr(ji, lyGanEl) || inArr(ji, lyZhiEl) ? '外象热闹、内里耗损，不宜冒进扩张' : (inArr(xi, lyGanEl) || inArr(xi, lyZhiEl) ? '顺势可得、宜把握机会' : '平稳过渡、稳中求进')) + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">💼 事业</div><div class="yb-v">' + career.join('；') + (xch.some(function (x) { return x.parts.indexOf(pd.month.zhi) >= 0; }) ? '；流年引动月柱（事业/平台宫），宜防上级、制度、平台内耗' : '') + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">💰 财运</div><div class="yb-v">' + wealth.join('；') + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">💑 姻缘</div><div class="yb-v">' + love.join('；') + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">👶 子女</div><div class="yb-v">' + child.join('；') + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">🏠 家庭</div><div class="yb-v">' + family.join('；') + '。</div></div>';
    html += '<div class="yb-row"><div class="yb-k">❤️ 健康</div><div class="yb-v">' + health.join('；') + '。</div></div>';
    html += '<p class="cite" style="margin-top:10px;">「' + QUOTE.sizhu_liunian.s + '」' + QUOTE.sizhu_liunian.t + '；又「' + QUOTE.yijing_bianyi.s + '」' + QUOTE.yijing_bianyi.t + (xch.length ? ('；本年与命局实象：' + xchTxt + '。') : '。') + '</p>';
    html += '</div></div></div>';
    return { html: html, rating: rating, year: year };
  }

  /* ============================ 六维总断 · 全局专线（深度版） ============================ */
  function buildSixDims(r, opts) {
    opts = opts || {};
    var isMale = r.input.gender === '男';
    var pd = r.pillars_detail;
    var dm = r.day_master.gan, dmEl = r.day_master.element;
    var ug = r.useful_god;
    var isHourUnknown = !!opts.isHourUnknown;
    var st = r.strength;
    var shenWeak = st.score <= -1.5, shenStrong = st.score >= 1.5;
    var yinEl = SHENG_WO[dmEl];
    var missing = [];
    ['木', '火', '土', '金', '水'].forEach(function (e) { if (r.wuxing[e] === 0) missing.push(e); });

    function collectStars(stars) {
      var res = [];
      ['year', 'month', 'day', 'hour'].forEach(function (p) {
        if (inArr(stars, pd[p].ten_god)) res.push({ p: p, tg: pd[p].ten_god, pillar: pd[p].gan + pd[p].zhi });
      });
      return res;
    }
    var spouseStar = isMale ? ['正财', '偏财'] : ['正官', '七杀'];
    var childStar = isMale ? ['正官', '七杀'] : ['食神', '伤官'];
    var spouse = collectStars(spouseStar);
    var child = collectStars(childStar);
    var yin = collectStars(['正印', '偏印']);
    var shangguan = collectStars(['食神', '伤官']);
    var caixing = collectStars(isMale ? ['正财', '偏财'] : ['正官', '七杀']);

    var html = '<div class="card"><div class="card-h">七 · 六维总断（事业、姻缘、子女、财运、家庭、健康）</div><div class="card-b">';

    // —— 事业 ——
    html += '<h3>1. 事业</h3>';
    if (yin.length) {
      html += '<p>' + dm + '（' + dmEl + '）' + (shenWeak ? '身弱，帮扶为要' : (shenStrong ? '身强，凭技可发' : '中和')) + '，命局印星（' + yin.map(function (x) { return x.pillar + x.tg; }).join('、') + '）透出，'
        + '《滴天髓》云"印绶根深，学堂显达"，主得师长、平台、资质之荫，宜以专业立身、靠体系与平台成长。';
    } else {
      html += '<p>' + dm + '（' + dmEl + '）' + (shenWeak ? '身弱且印星全缺，帮扶体系弱' : (shenStrong ? '身强，自立性强' : '中和')) + '，多凭技艺（食伤）或实干（财官）立身，须后天自补平台与资质。';
    }
    if (shangguan.length) {
      html += '兼见食伤（' + shangguan.map(function (x) { return x.pillar + x.tg; }).join('、') + '）泄秀，主才华外显、表达与技艺之长；'
        + '若印食同见，可成"伤官佩印"之格，以专业才华驭名望。';
    }
    if (pd.month.ten_god.indexOf('伤官') >= 0 && (pd.year.ten_god.indexOf('官') >= 0 || pd.day.ten_god.indexOf('七杀') >= 0)) {
      html += '</p><p class="cite warn">「' + QUOTE.shangguan_jianguan.s + '」' + QUOTE.shangguan_jianguan.t + '；月柱伤官、见官，职场易与上级/制度冲突，宜专业服人而非权斗。</p>';
    } else { html += '</p>'; }
    html += '<p class="det">事业应象：' + (shenWeak ? '早年宜积累专业与平台，逢生扶（印比）运方得依托发力，后发而稳者居多' : (shenStrong ? '凭技艺才华可中年发越，行财官运最佳' : '中和，随运顺势、稳中求进')) + '。</p>';

    // —— 姻缘 ——
    html += '<h3>2. 姻缘（' + (isMale ? '妻星：' + spouseStar.join('/') : '夫星：' + spouseStar.join('/')) + '）</h3>';
    html += '<p>' + (isMale ? '男命以财为妻' : '女命以官杀为夫') + '。' + (isMale ? '妻星' : '夫星') + '（' + spouseStar.join('、') + '）'
      + (spouse.length ? '现于 ' + spouse.map(function (x) { return x.pillar + x.tg; }).join('、') : '全局不显，缘迟或待运引') + '；'
      + '夫妻宫（日支 ' + pd.day.zhi + '，本气' + branchMainGod(pd.day.zhi, dm) + '）' + (inArr(r.kongwang, pd.day.zhi) ? '坐空亡，婚姻宜务实经营、忌虚浮' : '得位，配偶多有助力') + '。</p>';
    html += '<p class="cite">「' + QUOTE.fuqi_gong.s + '」' + QUOTE.fuqi_gong.t + '；红鸾在 ' + r.shen_sha.hongluan + '、桃花在 ' + r.shen_sha.taohua + '，逢其值年易有姻缘信号。</p>';
    if (isMale && pd.month.ten_god.indexOf('伤官') >= 0) {
      html += '<p class="cite warn">男命月干伤官，古称"伤官克官"，择偶宜宽和、忌苛求，否则口舌伤和。</p>';
    }
    if (!isMale && ((pd.year.ten_god.indexOf('正官') >= 0 && pd.day.ten_god.indexOf('七杀') >= 0) || (pd.month.ten_god.indexOf('七杀') >= 0 && spouse.some(function (s) { return s.tg.indexOf('正官') >= 0; })))) {
      html += '<p class="cite warn">女命官杀混杂（正官、七杀并见），易遇不同类型异性、关系复杂，宜专一、忌脚踏两船；非无姻缘，而是宜精神对等、契约清晰。</p>';
    }

    // —— 子女 ——
    html += '<h3>3. 子女宫（' + (isMale ? '子女星：官杀' : '子女星：食伤') + '）</h3>';
    html += '<p>子女星（' + childStar.join('、') + '）' + (child.length ? '现于 ' + child.map(function (x) { return x.pillar + x.tg; }).join('、') : '全局不显，弱而待引（中年相关运方旺）') + '；'
      + '子女宫（时柱 ' + pd.hour.gan + pd.hour.zhi + '，' + pd.hour.ten_god + '）。</p>';
    if (isHourUnknown) {
      html += '<p class="warn box">⚠ 时柱缺失（未提供出生时辰），子女宫细象与子女数量应期为<b>待定层</b>，补时辰后可定稿。子女星之强弱（上句）不依赖时辰，可定为确定层。</p>';
    } else {
      html += '<p class="cite">「' + QUOTE.zinv_gong.s + '」' + QUOTE.zinv_gong.t + (inArr(r.kongwang, pd.hour.zhi) ? '；时柱落空亡，子女缘宜中年稳固后更显。' : '。') + '</p>';
      html += '<p class="cite">「' + QUOTE.sizhu_shiyuan.s + '」' + QUOTE.sizhu_shiyuan.t + '</p>';
    }

    // —— 财运 ——
    html += '<h3>4. 财运</h3>';
    if (caixing.length) {
      html += '<p>' + (isMale ? '财星' : '官星（女命以官为夫亦兼权财）') + '现于 ' + caixing.map(function (x) { return x.pillar + x.tg; }).join('、') + '，财源有依（较藏支为优）。';
    } else {
      html += '<p>' + (isMale ? '财星' : '官星') + '全局不显（仅藏支或入库），非"财气通门户"之富局，须运岁引方现。';
    }
    if (inArr(missing, yinEl) && dmEl === '水') {
      html += '水日主以金为生源而金缺，身弱不胜财，宜技艺稳财而非投机。</p>';
    } else { html += '</p>'; }
    if (shenWeak) html += '<p class="cite">「' + QUOTE.caiduo_shenruo.s + '」' + QUOTE.caiduo_shenruo.t + '；身弱财旺（或财不透）则宜守，中年补印比之运方得承载，忌高风险投资。</p>';
    else if (shenStrong) html += '<p class="cite">「' + QUOTE.shenwang_caiwang.s + '」' + QUOTE.shenwang_caiwang.t + '；身强可胜财，行财乡自然称意。</p>';

    // —— 家庭 ——
    html += '<h3>5. 家庭（年柱祖上，月柱父母手足）</h3>';
    html += '<p>年柱 ' + pd.year.gan + pd.year.zhi + '（' + pd.year.ten_god + '）、月柱 ' + pd.month.gan + pd.month.zhi + '（' + pd.month.ten_god + '）为父母、根基宫；'
      + '空亡 ' + r.kongwang.join('、') + (inArr(r.kongwang, pd.year.zhi) || inArr(r.kongwang, pd.month.zhi) ? '，年月落空，家门荫力有减，宜离乡自创、以己力立身' : '，根基尚稳') + '。</p>';
    html += '<p class="cite">「' + QUOTE.kongwang.s + '」' + QUOTE.kongwang.t + '；吉神落空其力减半，须实运填实方显，故早年宜务实积累、保持利益边界。</p>';

    // —— 健康 ——
    html += '<h3>6. 健康（原局实象，无虚设神煞）</h3>';
    html += '<p>五行' + (missing.length ? ('缺 ' + missing.join('、') + ' → 对应 ' + missing.map(function (e) { return ORGAN[e]; }).join('、') + ' 先天偏弱') : '俱全，留意最弱一行之脏腑') + '。';
    if (inArr(missing, '金')) html += '金（肺、呼吸道）最弱，为首要体检关注。';
    if (inArr(missing, '水')) html += '水（肾、泌尿）偏弱。';
    html += '</p>';
    var xch0 = detectXingChongHe([pd.year.zhi, pd.month.zhi, pd.day.zhi, pd.hour.zhi]);
    if (xch0.length) {
      html += '<p>原局刑冲合会（' + xch0.map(function (x) { return x.text; }).join('、') + '）所涉地支，对应脏腑易现慢性反复之象（' + xch0.map(function (x) { return XCH_MEAN[x.type]; }).join('；') + '）。</p>';
    }
    html += '<p class="cite">「' + QUOTE.wuxing_pianku.s + '」' + QUOTE.wuxing_pianku.t + '；命理所示为体质倾向，健康决策以现代医学检查为准。</p>';

    html += '</div></div>';
    return { html: html };
  }

  /* ============================ 神煞与纳音补充 ============================ */
  function buildShenSha(r) {
    var ss = r.shen_sha;
    var html = '<div class="card"><div class="card-h">九 · 神煞与纳音补充论证（确定层）</div><div class="card-b">';
    html += '<table class="grid"><tr><th>神煞</th><th>所落</th><th>古典释义</th></tr>';
    var rows = [
      ['天乙贵人', ss.tianyi.join('、'), '《三命通会》"天乙者，命中遇之，危难有救，平居得贵人之助"'],
      ['驿马', ss.yima, '主变动、远行；落空亡则动而难扎根'],
      ['华盖', ss.huagai, '主聪慧孤高、喜玄学技艺'],
      ['文昌', ss.wenchange, '主文采学业；落空亡宜实学、忌虚名'],
      ['桃花（咸池）', ss.taohua, '主情缘人缘；过旺须防情累'],
      ['红鸾', ss.hongluan, '主姻缘喜庆之期'],
      ['天喜', ss.tianxi, '主喜庆之事，与红鸾相佐']
    ];
    rows.forEach(function (x) { html += '<tr><td>' + x[0] + '</td><td>' + x[1] + '</td><td>' + x[2] + '</td></tr>'; });
    html += '</table>';
    // 十二长生
    var cs = ss.changsheng;
    html += '<p class="sub">十二长生（日主五行在四支）：年支 ' + cs.year + '、月支 ' + cs.month + '、日支 ' + cs.day + '、时支 ' + cs.hour
      + '。日支（夫妻宫）临' + cs.day + '、时支（子女宫）临' + cs.hour + '，可作为宫位强弱之补象。</p>';
    // 纳音
    html += '<p class="sub">四柱纳音：年 ' + r.pillars_detail.year.nayin + '、月 ' + r.pillars_detail.month.nayin
      + '、日 ' + r.pillars_detail.day.nayin + '、时 ' + r.pillars_detail.hour.nayin + '。</p>';
    html += '</div></div>';
    return { html: html };
  }

  /* ============================ 可验证清单 ============================ */
  function buildVerify(r) {
    var list = r.da_yun.list;
    var birthYear = parseInt(r.input.date, 10);
    var ln = r.liu_nian;
    var items = [];
    items.push('日主 ' + r.day_master.gan + '（' + r.day_master.element + r.day_master.polarity + '），旺衰 ' + r.strength.label + '（评分 ' + r.strength.score + '）');
    items.push('喜用：' + r.useful_god.xi.join('、') + '；忌：' + r.useful_god.ji.join('、'));
    items.push('起运 ' + r.da_yun.start.age_years + '岁' + r.da_yun.start.age_months + '个月（' + r.da_yun.start.term_name + '后），' + r.da_yun.forward);
    list.slice(0, 3).forEach(function (d) {
      items.push('第' + d.index + '运 ' + d.pillar + '（' + d.ten_god + '）：约 ' + (birthYear + Math.round(d.start_age)) + '–' + (birthYear + Math.round(d.end_age)) + ' 年');
    });
    // 关键红鸾/桃花年
    var ss = r.shen_sha;
    ln.forEach(function (y) {
      if (y.zhi === ss.hongluan) items.push(y.year + '（' + y.pillar + '）红鸾值年，姻缘信号强');
    });
    items.push('空亡 ' + r.kongwang.join('、') + '；' + (inArr(r.kongwang, r.pillars_detail.day.zhi) ? '夫妻宫落空' : '夫妻宫不空') + '、' + (inArr(r.kongwang, r.pillars_detail.hour.zhi) ? '子女宫落空' : '子女宫不空'));
    var miss = [];
    ['木', '火', '土', '金', '水'].forEach(function (e) { if (r.wuxing[e] === 0) miss.push(e); });
    if (miss.length) items.push('五行缺 ' + miss.join('、') + ' → 对应脏腑先天偏弱');
    var cur = buildPast(r).curIdx;
    items.push('当前（' + r.ref_year + '）约行第 ' + (cur + 1) + ' 运 ' + (list[cur] ? list[cur].pillar : '—'));

    var html = '<div class="card"><div class="card-h">十 · 可验证性最强结论清单</div><div class="card-b"><ol class="ul">';
    items.forEach(function (it) { html += '<li>' + esc(it) + '</li>'; });
    html += '</ol></div></div>';
    return { html: html, items: items };
  }

  /* ============================ 主入口 ============================ */
  function generate(r, opts) {
    opts = opts || {};
    var name = (opts.name && opts.name.trim()) ? opts.name.trim() : '';
    var title = (name ? name + ' · ' : '') + '古典考释 · 六维专线（' + r.bazi.year + ' ' + r.bazi.month + ' ' + r.bazi.day + ' ' + r.bazi.hour + ' · ' + r.input.gender + '）';
    var body = '';
    body += wrapTerms(buildOverall(r, opts).html);
    body += wrapTerms(buildPattern(r).html);
    body += wrapTerms(buildDaYun(r).html);
    body += wrapTerms(buildLifeNodes(r, opts).html);
    body += wrapTerms(buildFuture(r).html);
    body += wrapTerms(buildYearly(r, opts).html);
    body += wrapTerms(buildSixDims(r, opts).html);
    body += wrapTerms(buildCoreConclusion(r).html);
    body += wrapTerms(buildShenSha(r).html);
    body += wrapTerms(buildVerify(r).html);

    var notice = opts.isHourUnknown
      ? '<p class="warn box">⚠ 未提供出生时辰：时柱（子女宫、部分桃花/文昌细节）为<b>待定层</b>；年月日、日主、用神、大运、流年、神煞、纳音均为<b>确定层</b>。补时辰即可定稿。</p>'
      : '';
    var disclaimer = '<div class="disclaimer"><b>郑重声明：</b>本测算为中华传统命理文化之研习推演，属于娱乐与民俗参考，<b>不构成任何医学、投资、法律或人生决策建议</b>。命理所示为体质与运势倾向，健康请以现代医学为准，重大抉择请理性判断。古籍无明据者，此处不妄断。</div>';

    var css = '<style>'
      + '.report{max-width:820px;margin:0 auto;padding:18px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",serif;color:#2b2b2b;line-height:1.7;background:#fbf7ef;}'
      + '.report h1{font-size:21px;text-align:center;margin:6px 0 2px;}'
      + '.report .sub2{text-align:center;color:#8a7a55;font-size:13px;margin-bottom:14px;}'
      + '.card{border:1px solid #d8c9a3;background:#fff;margin:14px 0;border-radius:8px;overflow:hidden;}'
      + '.card-h{background:#f0e4c8;padding:9px 14px;font-weight:700;color:#5a4a22;border-bottom:1px solid #e0d2a8;}'
      + '.card-b{padding:12px 16px;}'
      + '.card-b p{margin:7px 0;}'
      + '.name-line{background:#f6efe0;border:1px dashed #cbb888;border-radius:6px;padding:6px 10px;color:#5a4a22;font-size:14px;margin:2px 0 10px !important;}'
      + '.card-b h3{margin:14px 0 4px;color:#7a5c1e;font-size:16px;border-left:4px solid #c9a84a;padding-left:8px;}'
      + '.grid{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px;}'
      + '.grid th,.grid td{border:1px solid #e2d6b5;padding:6px 8px;text-align:left;vertical-align:top;}'
      + '.grid th{background:#f3ead2;}'
      + '.xi{color:#1a7a3a;} .ji{color:#b4322a;}'
      + '.cite{color:#6a5a3a;font-size:12.5px;border-left:3px solid #c9a84a;padding:2px 10px;background:#faf6ea;margin:8px 0;}'
      + '.warn{color:#9a3b15;}'
      + '.box{background:#fff6e8;border:1px solid #e6c98a;border-radius:6px;padding:9px 12px;}'
      + '.ul{margin:8px 0 8px 20px;padding:0;} .ul li{margin:5px 0;}'
      + '.sub{font-weight:600;color:#5a4a22;margin:10px 0 2px;}'
      + '.disclaimer{margin:16px 0 4px;padding:12px 14px;background:#f4f0e6;border:1px dashed #c3b48a;border-radius:8px;font-size:12.5px;color:#5a5240;}'
      + '.term{color:#1a5a9a;border-bottom:1px dashed #1a5a9a;cursor:pointer;}'
      + '.term-tip{background:#eef4fb;border:1px solid #bcd3ea;border-radius:8px;padding:9px 12px;font-size:13px;color:#2f5a82;margin:4px 0 6px;}'
      + '.tag{display:inline-block;padding:2px 7px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;}'
      + '.tag-daji{background:#d4edda;color:#155724;}'
      + '.tag-ji{background:#e8f5e9;color:#2e7d32;}'
      + '.tag-ping{background:#fff3cd;color:#856404;}'
      + '.tag-xiaoxiong{background:#ffe0b2;color:#e65100;}'
      + '.tag-xiong{background:#f8d7da;color:#721c24;}'
      + '.year-box{background:#fdf3e3;border:2px solid #d8a94a;border-radius:10px;padding:14px 16px;margin:6px 0;}'
      + '.year-box .yb-h{font-size:16px;font-weight:800;color:#9a5b00;margin:0 0 8px;}'
      + '.year-box .yb-row{display:flex;gap:10px;margin:8px 0;align-items:flex-start;}'
      + '.year-box .yb-k{flex:0 0 84px;font-weight:700;color:#7a4a00;}'
      + '.year-box .yb-v{flex:1;}'
      + '</style>';

    var inner = '<h1>古典考释 · 八字六维专线</h1>'
      + '<div class="sub2">以《易经》《滴天髓》《子平真诠》《穷通宝鉴》《三命通会》《渊海子平》《四柱预测学》等权威典籍为纲 · 无据不妄断</div>'
      + '<p class="term-tip">📖 本报告含八字专业术语，<b>蓝色虚线下划线</b>的词点一下即可看白话解释；文末「十一 · 术语白话解」有完整词典。</p>'
      + notice
      + body
      + buildGlossary().html
      + disclaimer;

    var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<title>' + esc(title) + '</title>' + css + '</head><body class="report">'
      + inner
      + '</body></html>';

    // fragment：可直接注入 H5 容器（含作用域样式），保留"返回"按钮
    var fragment = css + '<div class="report">' + inner + '</div>';

    return { title: title, html: html, fragment: fragment };
  }

  /* ============================ 术语白话解附录 ============================ */
  function buildGlossary() {
    var html = '<div class="card"><div class="card-h">十一 · 术语白话解（一看就懂）</div><div class="card-b">';
    html += '<p class="sub">报告里看不懂的词，在这里都能查到。也可直接点报告正文中的蓝色下划线词，即时弹出解释。</p>';
    html += '<details><summary style="cursor:pointer;font-weight:600;color:#7a5c1e;">▸ 展开完整术语词典（' + Object.keys(GLOSSARY).length + ' 条）</summary><div style="margin-top:10px;">';
    Object.keys(GLOSSARY).forEach(function (k) {
      html += '<p style="margin:6px 0;border-bottom:1px dashed #e2d6b5;padding-bottom:6px;"><b style="color:#1a5a9a;">' + esc(k) + '</b>：' + esc(GLOSSARY[k]) + '</p>';
    });
    html += '</div></details></div></div>';
    return { html: html };
  }

  return { generate: generate, QUOTE: QUOTE, GLOSSARY: GLOSSARY };
});

</script>
<script>
function pad(n){return (n<10?'0':'')+n;}
/* 解析多种日期格式：19880228 / 1988-02-28 / 1988/02/28 / 1988.2.28 / 1988年02月28日 */
function parseDateStr(s){
  s=(s||'').trim(); if(!s) return null;
  var m;
  if(/^\d{8}$/.test(s)) return {y:+s.slice(0,4), m:+s.slice(4,6), d:+s.slice(6,8)};
  if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) return {y:+m[1], m:+m[2], d:+m[3]};
  if((m=s.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?$/))) return {y:+m[1], m:+m[2], d:+m[3]};
  return null;
}
function fmtDate(p){ return p.y+'-'+pad(p.m)+'-'+pad(p.d); }

/* ===== 省市经度表（取省会/代表点东经度数，用于真太阳时校正） ===== */

function fillProv(){
  var sel=document.getElementById('prov');
  Object.keys(PROV).forEach(function(p){var o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
}
function fillCity(prov){
  var csel=document.getElementById('city'); csel.innerHTML='<option value="">— 市 —</option>';
  var rec=PROV[prov]; if(!rec||!rec[1]) return;
  Object.keys(rec[1]).forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;csel.appendChild(o);});
}
function curLon(){
  var prov=document.getElementById('prov').value, city=document.getElementById('city').value;
  var rec=PROV[prov]; if(!rec) return 116.4;
  if(city && rec[1] && rec[1][city]!=null) return rec[1][city];
  return rec[0];
}
document.getElementById('prov').onchange=function(){ fillCity(this.value); document.getElementById('lon').value=curLon(); };
document.getElementById('city').onchange=function(){ document.getElementById('lon').value=curLon(); };
document.getElementById('useLon').onclick=function(){ /* 仅作提示：手动值已写入 lon，生成时读取 */ };
fillProv();
document.getElementById('year').value = new Date().getFullYear();
/* 日期：日历选择回填文本框 */
document.getElementById('pickDate').onclick=function(){
  var dp=document.getElementById('datePicker');
  var p=parseDateStr(document.getElementById('date').value);
  if(p && p.y>1900 && p.y<2100) dp.value=fmtDate(p);
  try{ if(dp.showPicker) dp.showPicker(); else dp.click(); }catch(e){ dp.click(); }
};
document.getElementById('datePicker').onchange=function(){ if(this.value) document.getElementById('date').value=this.value; };

/* ===== 历史记录（localStorage） ===== */
var HKEY='bazi_hist_v1';
function loadHist(){ try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return [];} }
function saveHist(a){ try{localStorage.setItem(HKEY,JSON.stringify(a));}catch(e){} }
function renderHist(){
  var arr=loadHist(); var box=document.getElementById('histCard'); var list=document.getElementById('histList');
  if(!arr.length){box.style.display='none';return;}
  box.style.display='block';
  list.innerHTML=arr.map(function(it,idx){
    return '<div style="padding:7px 0;border-bottom:1px solid #ece0c0;font-size:13px;display:flex;justify-content:space-between;align-items:center;">'+
      '<span><b>'+esc(it.name||'(未命名)')+'</b> · '+it.bazi+' · '+it.gender+'<br><span style="color:#9a8a60;font-size:11px;">'+it.date+(it.unk?' · 缺时辰':'')+'</span></span>'+
      '<span><span class="hbtn" data-i="'+idx+'" style="color:#8a6d28;cursor:pointer;margin-left:10px;">查看</span> '+
      '<span class="hdel" data-i="'+idx+'" style="color:#b4322a;cursor:pointer;">删</span></span></div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('.hbtn'),function(el){el.onclick=function(){openHist(parseInt(this.getAttribute('data-i'),10));};});
  Array.prototype.forEach.call(list.querySelectorAll('.hdel'),function(el){el.onclick=function(){var a=loadHist();a.splice(parseInt(this.getAttribute('data-i'),10),1);saveHist(a);renderHist();};});
}
function openHist(i){
  var it=loadHist()[i]; if(!it) return;
  document.getElementById('report-body').innerHTML=it.html;
  document.getElementById('form').style.display='none';
  document.getElementById('histCard').style.display='none';
  document.getElementById('report').style.display='block';
  window.scrollTo(0,0);
}
document.getElementById('clearHist').onclick=function(){ if(confirm('确定清空全部历史记录？')){saveHist([]);renderHist();} };
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ===== 生成报告 ===== */
document.getElementById('go').onclick = function(){
  var rawDate = document.getElementById('date').value;
  var h = document.getElementById('hour').value;
  var m = document.getElementById('min').value;
  var gender = document.getElementById('gender').value;
  var cname = document.getElementById('cname').value.trim();
  var lon = parseFloat(document.getElementById('lon').value) || curLon();
  var unk = document.getElementById('unknowH').checked;
  var year = parseInt(document.getElementById('year').value, 10) || new Date().getFullYear();
  var err = document.getElementById('err');
  err.textContent='';
  var pd = parseDateStr(rawDate);
  if(!pd){err.textContent='日期格式无法识别，请按 1988-02-28 或 19880228 填写';return;}
  if(year < pd.y){err.textContent='查看年份不能早于出生年（'+pd.y+'）';return;}
  var date = fmtDate(pd);
  if(!unk){
    if(h===''||m===''){err.textContent='请填写出生时间，或勾选"不清楚出生时辰"';return;}
    h=parseInt(h,10);m=parseInt(m,10);
    if(isNaN(h)||h<0||h>23){err.textContent='小时应在 0-23';return;}
    if(isNaN(m)||m<0||m>59){err.textContent='分钟应在 0-59';return;}
  } else { h=12;m=0; }
  var dt = date+' '+pad(h)+':'+pad(m);
  document.getElementById('form').style.display='none';
  document.getElementById('report').style.display='none';
  document.getElementById('loading').style.display='block';
  setTimeout(function(){
    try{
      var r = BaziEngine.compute({date:dt, gender:gender, longitude:lon, refYear:year});
      var out = BaziReport.generate(r, {isHourUnknown:unk, name:cname, year:year});
      document.getElementById('report-body').innerHTML = out.fragment;
      // 存历史（最多 30 条）
      var arr=loadHist();
      arr.unshift({name:cname, gender:gender, date:dt, bazi:(r.bazi.year+' '+r.bazi.month+' '+r.bazi.day+' '+r.bazi.hour), unk:unk, html:out.fragment, ts:Date.now()});
      if(arr.length>30) arr=arr.slice(0,30);
      saveHist(arr); renderHist();
      document.getElementById('loading').style.display='none';
      document.getElementById('report').style.display='block';
      window.scrollTo(0,0);
    }catch(e){
      document.getElementById('loading').style.display='none';
      document.getElementById('form').style.display='block';
      err.textContent='生成失败：'+e.message;
    }
  }, 120);
};
document.getElementById('back').onclick = function(){
  document.getElementById('report').style.display='none';
  document.getElementById('histCard').style.display = loadHist().length ? 'block' : 'none';
  document.getElementById('form').style.display='block';
  window.scrollTo(0,0);
};
renderHist();
/* ===== 术语点击：弹出白话解释（移动端友好） ===== */
document.getElementById('report-body').addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.term') : null;
  if (!t) return;
  var k = t.getAttribute('data-k');
  var g = (window.BaziReport && BaziReport.GLOSSARY) || {};
  if (!g[k]) return;
  document.getElementById('termH').textContent = k;
  document.getElementById('termB').textContent = g[k];
  document.getElementById('termMask').style.display = 'flex';
});
document.getElementById('termClose').onclick = function () { document.getElementById('termMask').style.display = 'none'; };
document.getElementById('termMask').addEventListener('click', function (e) { if (e.target === this) this.style.display = 'none'; });
</script>
